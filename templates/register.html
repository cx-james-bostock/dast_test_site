{% extends 'layout.html' %}
{% block content %}
<h2>Register</h2>
<form method="POST">
    <p>
        <label>Username:</label>
        <input type="text" name="username" required>
    </p>
    <p>
        <label>Password:</label>
        <input type="password" name="password" required>
    </p>
    <p>
        <label>Role:</label>
        <input type="text" name="role" required>
    </p>
    <p>
        <button type="submit">Register</button>
    </p>
</form>
{% endblock %}
